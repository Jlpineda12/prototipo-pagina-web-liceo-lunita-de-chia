<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 463" role="img" aria-labelledby="t"><title id="t">Escudo del Liceo Lunita de Chía</title><defs>
  <linearGradient id="a-ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#3B3DA8"/><stop offset=".55" stop-color="#313293"/><stop offset="1" stop-color="#222370"/>
  </linearGradient>
  <linearGradient id="a-gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFE055"/><stop offset=".45" stop-color="#FECA0D"/><stop offset="1" stop-color="#F0B400"/>
  </linearGradient>
</defs>
<style>
.e-rim,.e-ring,.e-inner-rim,.e-field{transform-origin:200px 231.5px;animation:pop 1.1s cubic-bezier(.2,.9,.2,1.2) both}
.e-ring{animation-delay:.08s}.e-inner-rim{animation-delay:.14s}.e-field{animation-delay:.18s}
.e-moon{transform-origin:115px 271px;animation:rise 1.4s .35s cubic-bezier(.16,1,.3,1) both,glow 5s 2s ease-in-out infinite}
.e-star{transform-origin:235px 105.6px;animation:spark 1s .9s cubic-bezier(.2,1.6,.3,1) both,twinkle 3.2s 2s ease-in-out infinite}
.halo{transform-origin:235px 105.6px;animation:halo 3.2s 2s ease-in-out infinite;opacity:0}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translate(-32px,24px) rotate(-18deg);opacity:0}to{transform:none;opacity:1}}
@keyframes spark{from{transform:scale(0) rotate(-180deg);opacity:0}to{transform:none;opacity:1}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.16) rotate(14deg)}}
@keyframes halo{0%,100%{opacity:0;transform:scale(.6)}50%{opacity:.5;transform:scale(1.35)}}
@keyframes glow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 8px rgba(254,202,13,.55))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<circle class="halo" cx="235" cy="105.6" r="28" fill="#FECA0D"/>
