<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Eye & Mouth clipping paths (Rive converts these directly to Clipping masks) -->
    <clipPath id="eye-L-clip">
      <path d="M 303,441
               C 350,432 392,473 395,522
               C 398,568 361,599 316,597
               C 271,595 247,557 250,509
               C 253,465 268,448 303,441 Z"/>
    </clipPath>
    <clipPath id="eye-R-clip">
      <path d="M 480,398
               C 512,394 541,430 544,475
               C 547,514 526,534 497,532
               C 466,530 448,498 448,458
               C 448,421 459,401 480,398 Z"/>
    </clipPath>
    <clipPath id="mouth-clip">
      <path d="M 389,583
               C 387,573 399,572 415,570
               C 440,566 464,557 481,547
               C 492,541 499,549 500,566
               C 502,609 481,648 448,648
               C 414,648 391,615 389,583 Z"/>
    </clipPath>

    <!-- Single-shape 3D crescent gradient (ideal for Rive Mesh Deformation + adding extra Fills directly on Moon_Base) -->
    <radialGradient id="moon-single-grad" cx="515" cy="340" r="535" fx="540" fy="275" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF072"/>
      <stop offset="36%" stop-color="#FFDA3D"/>
      <stop offset="68%" stop-color="#F1A912"/>
      <stop offset="88%" stop-color="#C97710"/>
      <stop offset="100%" stop-color="#B0620E"/>
    </radialGradient>

    <radialGradient id="sclera-L-grad" cx="326" cy="492" r="98" fx="332" fy="478" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#FEF6E6"/>
      <stop offset="100%" stop-color="#E9CEAC"/>
    </radialGradient>
    <radialGradient id="sclera-R-grad" cx="496" cy="448" r="82" fx="502" fy="436" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="58%" stop-color="#FEF6E6"/>
      <stop offset="100%" stop-color="#EAD1B2"/>
    </radialGradient>

    <radialGradient id="iris-L-grad" cx="370" cy="534" r="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#45271A"/>
      <stop offset="45%" stop-color="#291712"/>
      <stop offset="100%" stop-color="#1E110D"/>
    </radialGradient>
    <radialGradient id="iris-R-grad" cx="524" cy="488" r="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#45271A"/>
      <stop offset="45%" stop-color="#291712"/>
      <stop offset="100%" stop-color="#1E110D"/>
    </radialGradient>

    <linearGradient id="mouth-cavity-grad" x1="440" y1="546" x2="448" y2="625" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#260A08"/>
      <stop offset="100%" stop-color="#4B1712"/>
    </linearGradient>
    <radialGradient id="tongue-grad" cx="452" cy="609" r="52" fx="450" fy="602" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FD8B78"/>
      <stop offset="52%" stop-color="#E75C4B"/>
      <stop offset="100%" stop-color="#C63E31"/>
    </radialGradient>
  </defs>

  <g id="Lunita_Root">
    <!-- Single 12-anchor Moon_Base path ready for 1-click Rive Mesh / Bones -->
    <g id="Body_Group">
      <path id="Moon_Base"
            d="M 565,83
               C 638,81 726,100 730,129
               C 733,149 690,159 648,181
               C 574,218 521,284 520,356
               C 519,446 575,542 666,580
               C 738,610 806,594 861,549
               C 883,531 899,534 900,556
               C 902,606 862,695 802,761
               C 722,848 614,884 505,882
               C 305,879 144,715 144,495
               C 144,268 330,87 565,83 Z"
            fill="url(#moon-single-grad)"/>
    </g>

    <g id="Face_Group">
      <g id="Eyebrow_L_Group">
        <path id="Eyebrow_L"
              d="M 248,421 C 243,418 244,405 252,390 C 264,370 288,356 309,356 C 319,356 324,363 321,371 C 318,378 308,380 295,387 C 278,396 266,408 257,418 C 254,422 250,423 248,421 Z"
              fill="#311C15"/>
      </g>

      <g id="Eyebrow_R_Group">
        <path id="Eyebrow_R"
              d="M 441,343 C 438,337 443,326 456,325 C 472,324 487,333 494,347 C 498,355 495,361 489,359 C 481,355 471,350 458,349 C 448,349 443,347 441,343 Z"
              fill="#361E16"/>
      </g>

      <g id="Eye_L_Group">
        <path id="Eye_L_Sclera"
              d="M 303,441 C 350,432 392,473 395,522 C 398,568 361,599 316,597 C 271,595 247,557 250,509 C 253,465 268,448 303,441 Z"
              fill="url(#sclera-L-grad)"/>
        <g id="Eye_L_Clip_Contents" clip-path="url(#eye-L-clip)">
          <g id="Eye_L_Pupil_Group">
            <ellipse id="Eye_L_Iris" cx="356" cy="508" rx="41" ry="60" transform="rotate(-17 356 508)" fill="url(#iris-L-grad)"/>
            <ellipse id="Eye_L_Catchlight" cx="340" cy="480" rx="13.2" ry="16.8" transform="rotate(-14 340 480)" fill="#FFFFFF"/>
          </g>
          <g id="Eye_L_Blink_Lid" transform="translate(0, -180)">
            <rect x="235" y="425" width="180" height="175" fill="#FFD639"/>
            <path d="M 240,596 Q 324,612 408,588" fill="none" stroke="#311C15" stroke-width="10" stroke-linecap="round"/>
          </g>
        </g>
        <path id="Eye_L_Eyelid_Rim"
              d="M 251,532 C 243,493 255,451 287,438 C 316,426 350,437 372,459 C 350,444 320,439 294,448 C 265,459 253,495 255,532 Z"
              fill="#311C15"/>
      </g>

      <g id="Eye_R_Group">
        <path id="Eye_R_Sclera"
              d="M 480,398 C 512,394 541,430 544,475 C 547,514 526,534 497,532 C 466,530 448,498 448,458 C 448,421 459,401 480,398 Z"
              fill="url(#sclera-R-grad)"/>
        <g id="Eye_R_Clip_Contents" clip-path="url(#eye-R-clip)">
          <g id="Eye_R_Pupil_Group">
            <ellipse id="Eye_R_Iris" cx="514" cy="464" rx="35.5" ry="58" transform="rotate(-17 514 464)" fill="url(#iris-R-grad)"/>
            <ellipse id="Eye_R_Catchlight" cx="498" cy="436" rx="11.2" ry="15.8" transform="rotate(-14 498 436)" fill="#FFFFFF"/>
          </g>
          <g id="Eye_R_Blink_Lid" transform="translate(0, -160)">
            <rect x="435" y="385" width="130" height="155" fill="#FFD639"/>
            <path d="M 440,536 Q 496,550 554,528" fill="none" stroke="#311C15" stroke-width="9" stroke-linecap="round"/>
          </g>
        </g>
        <path id="Eye_R_Eyelid_Rim"
              d="M 449,474 C 444,436 454,400 476,393 C 496,387 519,401 531,422 C 516,407 497,399 480,404 C 460,409 451,440 452,474 Z"
              fill="#311C15"/>
      </g>

      <g id="Mouth_Group">
        <path id="Mouth_Cavity"
              d="M 389,583 C 387,573 399,572 415,570 C 440,566 464,557 481,547 C 492,541 499,549 500,566 C 502,609 481,648 448,648 C 414,648 391,615 389,583 Z"
              fill="url(#mouth-cavity-grad)"/>
        <g id="Mouth_Tongue_Clip" clip-path="url(#mouth-clip)">
          <path id="Mouth_Tongue"
                d="M 405,634 C 409,605 433,592 459,593 C 482,594 496,605 496,626 C 496,645 473,654 447,653 C 424,652 403,646 405,634 Z"
                fill="url(#tongue-grad)"/>
        </g>
      </g>
    </g>
  </g>
</svg>
