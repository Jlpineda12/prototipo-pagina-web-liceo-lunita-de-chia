<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-labelledby="lunita-icfes-title">
  <title id="lunita-icfes-title">Lunita celebrando excelencia académica ICFES A+ con birrete de grado</title>
  <defs>
    <radialGradient id="moonGlow3" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFF2A6"/>
      <stop offset="55%" stop-color="#FFD43B"/>
      <stop offset="100%" stop-color="#F59F00"/>
    </radialGradient>
  </defs>

  <ellipse cx="130" cy="238" rx="50" ry="9" fill="#0B1838" opacity="0.12"/>

  <!-- Confetti & celebration stars -->
  <path d="M40 84 L43 75 L46 84 L55 87 L46 90 L43 99 L40 90 L31 87 Z" fill="#58CC02"/>
  <path d="M214 82 L217 73 L220 82 L229 85 L220 88 L217 97 L214 88 L205 85 Z" fill="#FFD43B"/>
  <circle cx="52" cy="136" r="4" fill="#1CB0F6"/>
  <circle cx="218" cy="144" r="4.5" fill="#FF4B4B"/>
  <rect x="64" y="48" width="10" height="5" rx="2.5" fill="#FF4B4B" transform="rotate(-35 69 50)"/>
  <rect x="196" y="46" width="10" height="5" rx="2.5" fill="#1CB0F6" transform="rotate(30 201 48)"/>

  <!-- Arms raised in victory -->
  <path d="M74 134 C54 114, 44 98, 52 90 C59 83, 73 102, 84 120 Z" fill="#F59F00"/>
  <path d="M73 132 C56 114, 47 100, 54 93 C59 87, 71 104, 82 121 Z" fill="#FFD43B"/>
  <path d="M168 130 C186 108, 200 90, 193 82 C186 76, 171 95, 159 116 Z" fill="#F59F00"/>
  <path d="M166 128 C184 108, 196 92, 190 85 C185 80, 172 97, 160 117 Z" fill="#FFD43B"/>

  <!-- Jumping boots -->
  <g fill="#0B1838">
    <rect x="86" y="198" width="28" height="22" rx="11" transform="rotate(14 100 209)"/>
    <rect x="138" y="196" width="28" height="22" rx="11" transform="rotate(-14 152 207)"/>
  </g>

  <!-- Moon body (slightly lifted for jump) -->
  <g transform="translate(0, -6)">
    <path d="M158 34 C96 30, 52 78, 54 138 C56 196, 106 226, 164 214 C192 208, 212 192, 216 180 C219 171, 207 167, 198 172 C178 184, 146 182, 130 156 C114 130, 122 92, 150 74 C162 66, 174 62, 178 52 C182 42, 170 35, 158 34 Z" fill="#F59F00"/>
    <path d="M155 38 C98 35, 57 80, 59 136 C61 190, 108 219, 162 208 C186 203, 205 190, 210 179 C190 190, 145 192, 125 159 C106 128, 117 87, 148 68 C160 60, 171 57, 173 49 C174 42, 164 38, 155 38 Z" fill="url(#moonGlow3)"/>

    <!-- Graduation cap -->
    <g transform="translate(114, 34) rotate(-10)">
      <path d="M-24 14 L-24 30 C-10 38, 16 38, 28 30 L28 14 Z" fill="#0B1838"/>
      <polygon points="0,-6 44,12 0,28 -44,12" fill="#1E3A8A" stroke="#0B1838" stroke-width="2"/>
      <circle cx="0" cy="11" r="4" fill="#FFD43B"/>
      <path d="M0 11 L30 22 L30 40" fill="none" stroke="#FFD43B" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="30" cy="42" r="4.5" fill="#F59F00"/>
    </g>

    <!-- Happy squinting/starry eyes -->
    <path d="M82 126 Q94 114 106 126" fill="none" stroke="#0B1838" stroke-width="5" stroke-linecap="round"/>
    <path d="M120 124 Q132 112 144 124" fill="none" stroke="#0B1838" stroke-width="5" stroke-linecap="round"/>

    <!-- Rosy cheeks & big joyful smile -->
    <ellipse cx="76" cy="138" rx="9" ry="5" fill="#FF8787" opacity="0.65"/>
    <ellipse cx="146" cy="136" rx="9" ry="5" fill="#FF8787" opacity="0.65"/>
    <path d="M100 137 C107 151, 123 151, 129 136 Z" fill="#0B1838"/>
    <path d="M106 144 C112 148, 119 148, 124 143 C118 141, 112 141, 106 144 Z" fill="#FF6B6B"/>

    <!-- A+ Medal -->
    <g transform="translate(114, 184)">
      <circle cx="0" cy="0" r="18" fill="#58CC02" stroke="#FFFFFF" stroke-width="3"/>
      <text x="0" y="5" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF">A+</text>
    </g>
  </g>
</svg>
