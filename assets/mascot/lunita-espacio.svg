<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 260" role="img" aria-labelledby="lunita-espacio-title">
  <title id="lunita-espacio-title">Lunita astronauta con cohete para NASA Space Apps y Aula Virtual</title>
  <defs>
    <radialGradient id="moonGlow4" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FFF2A6"/>
      <stop offset="55%" stop-color="#FFD43B"/>
      <stop offset="100%" stop-color="#F59F00"/>
    </radialGradient>
  </defs>

  <ellipse cx="130" cy="236" rx="56" ry="10" fill="#0B1838" opacity="0.12"/>

  <!-- Mini rocket floating beside Lunita -->
  <g transform="translate(202, 86) rotate(20)">
    <path d="M0 -24 C10 -12, 12 8, 8 18 L-8 18 C-12 8, -10 -12, 0 -24 Z" fill="#FFFFFF" stroke="#0B1838" stroke-width="2.5"/>
    <path d="M0 -24 C5 -16, 7 -8, 8 -2 L-8 -2 C-7 -8, -5 -16, 0 -24 Z" fill="#FF4B4B"/>
    <circle cx="0" cy="5" r="5" fill="#1CB0F6" stroke="#0B1838" stroke-width="2"/>
    <path d="M-8 12 L-16 22 L-6 18 Z" fill="#FF4B4B"/>
    <path d="M8 12 L16 22 L6 18 Z" fill="#FF4B4B"/>
    <path d="M-4 19 L0 31 L4 19 Z" fill="#FFD43B"/>
  </g>

  <!-- Boots -->
  <g fill="#0B1838">
    <rect x="92" y="206" width="28" height="22" rx="11"/>
    <rect x="136" y="206" width="28" height="22" rx="11"/>
    <rect x="90" y="218" width="32" height="12" rx="6" fill="#1CB0F6"/>
    <rect x="134" y="218" width="32" height="12" rx="6" fill="#1CB0F6"/>
  </g>

  <!-- Arms -->
  <path d="M74 148 C54 154, 48 168, 56 176 C62 182, 74 174, 80 164 Z" fill="#F59F00"/>
  <path d="M74 149 C58 154, 51 166, 57 173 C62 178, 72 171, 78 162 Z" fill="#FFD43B"/>
  <path d="M170 142 C188 134, 198 124, 194 114 C190 106, 176 114, 162 128 Z" fill="#F59F00"/>
  <path d="M169 140 C185 133, 194 124, 191 116 C188 110, 176 117, 163 129 Z" fill="#FFD43B"/>

  <!-- Moon body -->
  <path d="M158 34 C96 30, 52 78, 54 138 C56 196, 106 226, 164 214 C192 208, 212 192, 216 180 C219 171, 207 167, 198 172 C178 184, 146 182, 130 156 C114 130, 122 92, 150 74 C162 66, 174 62, 178 52 C182 42, 170 35, 158 34 Z" fill="#F59F00"/>
  <path d="M155 38 C98 35, 57 80, 59 136 C61 190, 108 219, 162 208 C186 203, 205 190, 210 179 C190 190, 145 192, 125 159 C106 128, 117 87, 148 68 C160 60, 171 57, 173 49 C174 42, 164 38, 155 38 Z" fill="url(#moonGlow4)"/>

  <!-- Space explorer collar & mission patch -->
  <path d="M74 166 C98 180, 148 182, 178 171 C184 169, 187 180, 180 185 C148 197, 96 195, 70 179 C64 175, 68 163, 74 166 Z" fill="#E2E8F0" stroke="#0B1838" stroke-width="2.5"/>
  <circle cx="116" cy="184" r="9" fill="#0B1838"/>
  <path d="M116 178 L117.8 182 L122 182 L118.6 184.6 L119.8 188.5 L116 186.2 L112.2 188.5 L113.4 184.6 L110 182 L114.2 182 Z" fill="#1CB0F6"/>

  <!-- Eyes + Cute glossy space visor arc -->
  <g>
    <ellipse cx="94" cy="124" rx="13" ry="15" fill="#0B1838"/>
    <circle cx="90" cy="119" r="5" fill="#FFFFFF"/>
    <circle cx="98" cy="129" r="2.2" fill="#FFFFFF"/>

    <ellipse cx="132" cy="122" rx="13" ry="15" fill="#0B1838"/>
    <circle cx="128" cy="117" r="5" fill="#FFFFFF"/>
    <circle cx="136" cy="127" r="2.2" fill="#FFFFFF"/>

    <!-- Transparent sky-blue helmet visor raised slightly on top -->
    <path d="M62 110 C64 68, 134 62, 158 96 C163 103, 156 112, 146 110 C122 104, 86 106, 68 115 C64 117, 62 114, 62 110 Z" fill="#38BDF8" fill-opacity="0.32" stroke="#0284C7" stroke-width="3"/>
    <path d="M80 84 C96 76, 114 76, 128 82" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>

    <!-- Cheeks & determined happy smile -->
    <ellipse cx="77" cy="138" rx="9" ry="5.5" fill="#FF8787" opacity="0.6"/>
    <ellipse cx="146" cy="136" rx="9" ry="5.5" fill="#FF8787" opacity="0.6"/>
    <path d="M104 139 Q114 148 124 138" fill="none" stroke="#0B1838" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
